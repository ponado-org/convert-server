name: convert-server

# Self-hosted conversion service - prebuilt image.
#
# Renders Typst templates to PDF, converts images/PDFs into browser-safe
# formats, and delegates Office documents to Gotenberg. One instance serves
# every project; clients call it over HTTP.
#
# Copy-paste friendly: no local source needed, just pulls the published image.
#
#   docker compose up -d              # pull + run
#   CONVERT_IMAGE=... docker compose up -d
#
# Reachable as http://convert-server:3100 from the shared `convert` docker
# network, or via the published port on the host (CONVERT_PORT, default 3100).
#
# Gotenberg is optional. Point CONVERT_GOTENBERG_URL at it, and make sure this
# container shares a docker network with it (e.g. add the Gotenberg network
# below and list it under `networks:`).
#
# To build the image from local source instead, run:
#   docker compose -f compose.build.yml up -d --build

services:
  convert-server:
    # Override the whole ref (registry + tag) with CONVERT_IMAGE when pulling
    # from a different registry or a pinned release. Variant tags: :core,
    # :typst, or immutable vX.Y.Z-core / vX.Y.Z-typst.
    image: ${CONVERT_IMAGE:-ghcr.io/ponado-org/convert-server:latest}
    container_name: convert-server
    restart: unless-stopped
    ports:
      - "${CONVERT_PORT:-3100}:3100"
    environment:
      # Parallel conversions (typst and vips backends). Empty -> NumCPU,
      # <=0 -> unlimited.
      CONVERT_MAX_CONCURRENCY: ${CONVERT_MAX_CONCURRENCY:-}
      # Request body cap in MB (uploaded files + encoded shadow files).
      CONVERT_MAX_BODY_MB: ${CONVERT_MAX_BODY_MB:-50}
      # Office/text conversions. Leave empty to disable them.
      CONVERT_GOTENBERG_URL: ${CONVERT_GOTENBERG_URL:-}
      # Expose /gotenberg/* as a reverse proxy to the URL above.
      CONVERT_GOTENBERG_PROXY: ${CONVERT_GOTENBERG_PROXY:-true}
      TZ: ${TZ:-UTC}
    volumes:
      # Shared font pool: every .ttf/.otf in here is visible to all renders.
      - ${CONVERT_FONTS_DIR:-./fonts}:/app/fonts:ro
    networks:
      - convert
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Lookup-or-create by fixed name: other compose projects join with
  #   networks: { convert: { external: true } }
  # Override the network name with CONVERT_NETWORK to attach to an existing one.
  convert:
    name: ${CONVERT_NETWORK:-convert}
  # To reach Gotenberg on another compose project's network, uncomment and
  # add it to the service's `networks:` list:
  # gotenberg:
  #   name: ${CONVERT_GOTENBERG_NETWORK:-gotenberg}
  #   external: true
